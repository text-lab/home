<script src="../js/news.js"></script>
<script>const container = document.getElementById("all-news");

const BADGE_COLORS = {
  Paper: "var(--orange)",
  Software: "var(--blue)",
  Project: "#2e7d32",
  Appointment: "#6d4c41",
  Award: "#9c6a00",
  Conference: "#6a4fb3",
  Teaching: "#00838f"
};

[...NEWS_ITEMS]
  .sort((a, b) => new Date(b.sortDate) - new Date(a.sortDate))
  .forEach(item => {

    const li = document.createElement("li");
    li.className = "news-page-item";

    const badgeColor =
      BADGE_COLORS[item.category] || "var(--orange)";

    const linksHtml =
      Array.isArray(item.links) && item.links.length > 0
        ? item.links.map(link => `
            <a href="${link.url}" target="_blank" rel="noopener">
              <span class="material-symbols-outlined">${link.icon}</span>
              ${link.label}
            </a>
          `).join("")
        : "";

    li.innerHTML = `
      <div class="news-page-meta">

        <span class="news-page-date">
          ${item.date}
        </span>

        <span class="news-tag"
              style="background:${badgeColor}">
          ${item.category}
        </span>

      </div>

      <div class="news-page-content">

        <span class="news-page-title">
          ${item.title}
        </span>

        <p class="news-page-text">
          ${item.description}
        </p>

        ${linksHtml ? `
          <div class="news-page-actions">
            ${linksHtml}
          </div>
        ` : ""}

      </div>
    `;

    container.appendChild(li);
  });
</script>

<script src="../js/main.js"></script>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>

</body>
